<html>
<head>
	<title> CSS Filter Example </title>
	
	<style>
		img {
			width:700px;
			filter: grayscale(1000%);
			transition: 0.5s;
	

		}
		
		img:hover{
			filter: grayscale(0%) brightness(111%);
			}
	</style>
</head>

<body>
<center>

	<h2> Css Filter property </h2>
	
	<img src="cat.jpg" alt="cat">
	<img src="website.jpg" alt="cat">
</center>
</body>
</html>
