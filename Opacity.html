<html>
<head>
	<title> CSS Opacity Example </title>
	<style>
		.box1 {
			background-color: red;
			opacity: 1;
		}
		.box2 {
			background-color: yellow;
			opacity: 0.5;
		}
		.box3 {
			background-color: blue;
			opacity: 0.2;
		}
	</style>
</head>
<body>

	<div class="box1">
		opacity 1
	</div>
	
	<div class="box2">
		opacity 2.4
	</div>
	
	<div class="box3">
		opacity 1.5
	</div>
	
</body>
</html>
